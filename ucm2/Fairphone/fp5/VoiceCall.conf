# Use case configuration for Fairphone 5
# Author: Luca Weiss <luca.weiss@fairphone.com>

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 1"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='QUIN_MI2S_RX Voice Mixer VoiceMMode1' 0"
		cset "name='VoiceMMode1 Capture Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value.TQ "VoiceCall"
}

SectionDevice."Earpiece" {
	Comment "Earpiece Playback"

	EnableSequence [
		# Make L/Top quieter
		cset "name='Amplifier L PCM Playback Volume' 25%"
		# Make R/bottom silence/mute
		cset "name='Amplifier R PCM Playback Volume' 100%"
	]
	DisableSequence [
		# change to default
		cset "name='Amplifier L PCM Playback Volume' 0"
		cset "name='Amplifier R PCM Playback Volume' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 100
		# Make audio to mono during usage of Earpiece
		PlaybackChannels 1

		PlaybackMixer "default:${CardId}"
	}
}


SectionDevice."Microphone" {
	Comment "Bottom Microphone"

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"

		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"

		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CapturePCM "hw:${CardId},1"
		CapturePriority 200
		CaptureMixerElem "ADC1"
	}
}
